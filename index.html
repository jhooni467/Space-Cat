<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#222a5e">
  <meta name="description" content="SpaceCat: un gatito astronauta cruza de un punto A a un punto B esquivando obstáculos.">
  <title>SpaceCat</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="stage">
    <canvas id="game" aria-label="SpaceCat"></canvas>

    <button id="pauseBtn" class="hidden" aria-label="Pausa">❚❚</button>

    <div id="touch" class="hidden">
      <div class="pad">
        <button class="btn" data-action="left" aria-label="Izquierda">◀</button>
        <button class="btn" data-action="right" aria-label="Derecha">▶</button>
      </div>
      <div class="pad">
        <button class="btn big" data-action="jump" aria-label="Saltar">▲</button>
      </div>
    </div>
  </div>

  <div id="rotate">
    <div class="rotate-card">
      <div class="rotate-icon">📱</div>
      <p>Gira tu dispositivo<br>SpaceCat se juega en horizontal</p>
    </div>
  </div>

  <noscript>SpaceCat necesita JavaScript para funcionar.</noscript>

  <script src="js/config.js"></script>
  <script src="js/input.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/assets.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/level.js"></script>
  <script src="js/player.js"></script>
  <script src="js/render.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
