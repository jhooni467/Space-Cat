<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#222a5e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Space Cat">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="description" content="SpaceCat: un gatito astronauta cruza de un punto A a un punto B esquivando obstáculos.">
  <title>Space Cat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="safe" aria-hidden="true"></div>
  <div id="stage">
    <canvas id="game" aria-label="Space Cat"></canvas>

    <button id="pauseBtn" class="hidden" aria-label="Pausa">❚❚</button>

    <div id="touch" class="hidden">
      <div class="pad">
        <button class="btn" data-action="left" aria-label="Izquierda">◀</button>
        <button class="btn" data-action="right" aria-label="Derecha">▶</button>
      </div>
      <div class="pad">
        <button class="btn big" data-action="jump" aria-label="Saltar">▲</button>
      </div>
    </div>
  </div>

  <div id="pauseMenu" class="hidden">
    <div class="menu-card">
      <h2>Pausa</h2>
      <button class="menu-btn" data-menu="resume">Continuar</button>
      <button class="menu-btn alt" data-menu="restart">Reiniciar nivel</button>
    </div>
  </div>

  <div id="rotate">
    <div class="rotate-card">
      <div class="rotate-icon">📱</div>
      <p>Gira tu dispositivo.<br>Space Cat se juega en horizontal.</p>
    </div>
  </div>

  <noscript>SpaceCat necesita JavaScript para funcionar.</noscript>

  <script src="config.js"></script>
  <script src="view.js"></script>
  <script src="perf.js"></script>
  <script src="input.js"></script>
  <script src="audio.js"></script>
  <script src="assets.js"></script>
  <script src="skins.js"></script>
  <script src="scenery.js"></script>
  <script src="pixelart.js"></script>
  <script src="levels.js"></script>
  <script src="level.js"></script>
  <script src="player.js"></script>
  <script src="render.js"></script>
  <script src="game.js"></script>
  <script src="pwa.js"></script>
  <script src="main.js"></script>
</body>
</html>
